    <rect x="690" y="196" width="210" height="79" rx="11" fill="#f2f8f4" stroke="#e6eee8"/>
    <rect x="911" y="196" width="210" height="79" rx="11" fill="#f2f8f4" stroke="#e6eee8"/>
