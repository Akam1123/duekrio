    <rect x="1024" y="133" width="95" height="28" rx="7" fill="#f2f8f2"/>
    <text x="1038" y="152" fill="#55816b" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="650">Fictional sample</text>
