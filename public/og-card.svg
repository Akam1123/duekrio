<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Orvaket — Know why the invoice is stuck</title>
  <desc id="desc">A free browser workspace for human-reviewed invoice follow-up. Fictional sample board.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdfa"/><stop offset="1" stop-color="#f0f8f3"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6eee0"/><stop offset="1" stop-color="#e8f5e8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="23" flood-color="#254938" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1034" cy="170" r="308" fill="url(#glow)" opacity=".58"/>
  <circle cx="1086" cy="188" r="368" fill="none" stroke="#cfe7d7" stroke-width="1.5"/>
  <rect x="66" y="48" width="42" height="42" rx="13" fill="#143d3b"/>
  <circle cx="87" cy="69" r="10" fill="none" stroke="#b5e9d0" stroke-width="6"/>
  <circle cx="106" cy="51" r="5" fill="#e8b577"/>
  <text x="122" y="78" fill="#15383b" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="750">Orvaket</text>
  <text x="67" y="173" fill="#247d69" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="3" font-weight="750">FREE INVOICE FOLLOW-UP WORKSPACE</text>
  <text x="65" y="247" fill="#183b3d" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="750">Know why the invoice</text>
  <text x="65" y="312" fill="#27866d" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="750">is stuck.</text>
  <text x="67" y="405" fill="#426d64" font-family="Segoe UI, Arial, sans-serif" font-size="20">Turn an aging CSV into a clear next move.</text>
  <text x="67" y="436" fill="#426d64" font-family="Segoe UI, Arial, sans-serif" font-size="20">Track the blocker, owner, and payment promise.</text>
  <rect x="66" y="523" width="337" height="44" rx="12" fill="#e8f5eb" stroke="#cae5d1"/>
  <circle cx="88" cy="545" r="4" fill="#53aa77"/>
  <text x="105" y="552" fill="#225e50" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Free to use · Data stays in your browser</text>

  <g filter="url(#shadow)">
    <rect x="667" y="116" width="477" height="424" rx="20" fill="#fff" stroke="#d7e7db"/>
