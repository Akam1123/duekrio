    <rect x="691" y="308" width="31" height="30" rx="8" fill="#fbe9e2"/><text x="702" y="329" fill="#b67662" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="750">N</text>
    <text x="737" y="321" fill="#204541" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Northstar Studio</text>
    <text x="737" y="337" fill="#9aaca4" font-family="Segoe UI, Arial, sans-serif" font-size="10">INV-1042 · 19 days overdue</text>
    <rect x="1000" y="311" width="81" height="24" rx="6" fill="#fff0ea"/><text x="1013" y="328" fill="#bb765e" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">Missing PO</text>
    <line x1="690" y1="348" x2="1122" y2="348" stroke="#e9f0e9"/>
    <rect x="691" y="359" width="31" height="30" rx="8" fill="#e6f3e9"/><text x="702" y="380" fill="#5c9771" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="750">F</text>
    <text x="737" y="372" fill="#204541" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Fieldstone Partners</text>
    <text x="737" y="388" fill="#9aaca4" font-family="Segoe UI, Arial, sans-serif" font-size="10">INV-1068 · 11 days overdue</text>
    <rect x="1011" y="362" width="70" height="24" rx="6" fill="#fff4df"/><text x="1025" y="379" fill="#b48a46" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">Dispute</text>
    <rect x="690" y="417" width="432" height="98" rx="11" fill="#edf7ef"/>
    <circle cx="723" cy="465" r="18" fill="#d8eede"/>
    <text x="712" y="473" fill="#338a69" font-family="Segoe UI, Arial, sans-serif" font-size="21">→</text>
    <text x="754" y="452" fill="#398b69" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1.1" font-weight="750">NEXT ACTION</text>
    <text x="754" y="477" fill="#205546" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Request the signed PO from Northstar</text>
