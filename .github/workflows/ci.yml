name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- Duenara-offline.html PromiseLedger-offline.html
      - run: npm run build:hosted
        env:
          # Build-only origin. Production must use the exact claimed Pages URL.
          PUBLIC_ORIGIN: https://akam1123.github.io/
