name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- Duekrio-offline.html Duenara-offline.html PromiseLedger-offline.html
      - run: npm run build:hosted
        env:
          # Build-only placeholder, not a claimed deployment URL.
          # Production must use the exact hostname assigned by Pages.
          PUBLIC_ORIGIN: https://qa-duekrio.pages.dev/
