name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- Orvaket-offline.html Duekrio-offline.html Duenara-offline.html PromiseLedger-offline.html
      - run: npm run build:hosted
        env:
          # Build-only placeholder, not a claimed deployment URL.
          # Production must use the exact hostname assigned by Pages.
          PUBLIC_ORIGIN: https://qa-orvaket.pages.dev/
      - run: npm run verify:hosted
        env:
          PUBLIC_ORIGIN: https://qa-orvaket.pages.dev/
      - run: npm run build:hosted
        env:
          PUBLIC_ORIGIN: https://duekrio.pages.dev/
      - run: npm run verify:hosted
        env:
          PUBLIC_ORIGIN: https://duekrio.pages.dev/
      - run: npm run build:hosted
        env:
          PUBLIC_ORIGIN: https://duenara.pages.dev/
      - run: npm run verify:hosted
        env:
          PUBLIC_ORIGIN: https://duenara.pages.dev/
      - run: npm run build:hosted
        env:
          PUBLIC_ORIGIN: https://orvaket.pages.dev/
      - run: npm run verify:hosted
        env:
          PUBLIC_ORIGIN: https://orvaket.pages.dev/
